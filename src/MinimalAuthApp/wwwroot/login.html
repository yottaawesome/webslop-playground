<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #f5f5f5;
        }
        .login-card {
            background: white; padding: 2rem; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 360px;
        }
        h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 0.9rem; }
        input {
            width: 100%; padding: 10px 12px; border: 1px solid #ccc;
            border-radius: 4px; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #0078d4; }
        button {
            width: 100%; padding: 10px; background: #0078d4; color: white;
            border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover { background: #006abc; }
        .error {
            background: #fee; color: #c00; padding: 8px 12px;
            border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem;
            text-align: center; display: none;
        }
        .hint {
            text-align: center; margin-top: 1rem; font-size: 0.8rem; color: #888;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Sign In</h1>
        <div class="error" id="error">Invalid username or password.</div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p class="hint">Demo: admin / password</p>
    </div>
    <script>
        // Redirect to home if already authenticated
        if (sessionStorage.getItem("jwt")) {
            window.location.href = "/";
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            document.getElementById("error").style.display = "none";

            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });

            if (res.ok) {
                const { token } = await res.json();
                sessionStorage.setItem("jwt", token);
                window.location.href = "/";
            } else {
                document.getElementById("error").style.display = "block";
            }
        });
    </script>
</body>
</html>
